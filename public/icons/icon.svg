<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E2247"/>
      <stop offset="50%" stop-color="#8B1E3F"/>
      <stop offset="100%" stop-color="#5E1128"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Subtle Decorative Background Circles -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.15"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.12"/>

  <!-- Group for Shopping Bag with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Bag Handle Behind -->
    <path d="M 196 215 V 155 C 196 122 222 96 256 96 C 290 96 316 122 316 155 V 215" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="18" 
          stroke-linecap="round"/>

    <!-- Bag Body -->
    <path d="M 148 200 L 168 400 C 170 414 182 424 196 424 L 316 424 C 330 424 342 414 344 400 L 364 200 C 365 189 356 180 345 180 L 167 180 C 156 180 147 189 148 200 Z" 
          fill="url(#bagGrad)"/>

    <!-- Bag Rim / Fold Top -->
    <path d="M 148 200 C 147 189 156 180 167 180 L 345 180 C 356 180 365 189 364 200 L 362 216 L 150 216 Z" 
          fill="#F1F5F9" opacity="0.95"/>
    <line x1="150" y1="216" x2="362" y2="216" stroke="#E2E8F0" stroke-width="2"/>

    <!-- Bag Handle Mounts / Studs -->
    <circle cx="196" cy="216" r="8" fill="url(#goldGrad)"/>
    <circle cx="316" cy="216" r="8" fill="url(#goldGrad)"/>

    <!-- Decorative Central Emblem: Kali Mata Store motif (Sprout / Leaf & Store Star) -->
    <!-- Golden Shopping Heart / Star Emblem -->
    <g transform="translate(256, 310)">
      <!-- Golden Circle Badge -->
      <circle cx="0" cy="0" r="44" fill="#8B1E3F"/>
      <circle cx="0" cy="0" r="41" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>

      <!-- Stylized KM Monogram / Grocery Sprout in Gold -->
      <path d="M -14 12 L -14 -12 L 0 4 L 14 -12 L 14 12" 
            fill="none" 
            stroke="url(#goldGrad)" 
            stroke-width="4.5" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
      <circle cx="0" cy="-18" r="3.5" fill="#FDE68A"/>
    </g>

    <!-- Warm Accent Ribbon Under Top Edge -->
    <rect x="175" y="222" width="162" height="4" rx="2" fill="url(#goldGrad)"/>
  </g>

  <!-- Bengali Store Tag subtle text or star spark -->
  <g transform="translate(370, 160)" filter="url(#glow)">
    <path d="M 0 -12 L 3 -3 L 12 0 L 3 3 L 0 12 L -3 3 L -12 0 L -3 -3 Z" fill="url(#goldGrad)"/>
  </g>
  <g transform="translate(140, 360)" filter="url(#glow)" opacity="0.7">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="url(#goldGrad)"/>
  </g>
</svg>
